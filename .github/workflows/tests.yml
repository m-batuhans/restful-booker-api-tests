# This workflow only runs the test suite (mvn clean test). It deliberately does NOT run
# tools/generate_cases.py or tools/fetch_api_docs.py:
#   - Generation is a manual, one-time step reviewed by a human (see docs/02-review.md).
#     Gemini's output is not deterministic, so re-running it in CI would not reproduce the
#     reviewed case list, and CI has no way to re-review it.
#   - The suite runs against restful-booker's shared public instance, which resets itself
#     periodically. A CI run can therefore fail for reasons unrelated to the code under test.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B clean test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
